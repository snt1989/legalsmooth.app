<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リーガルスムーズ案件管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 深い藍緑のサイドバー+白い作業面。差し色は朱色(未対応・期限超過)。案件=1フォルダの考え方で、書類の揃い具合を主役にする */
:root{
 --side:#fff;--side-ink:#231815;--side-dim:#8A7C82;--side-hover:#FDEAF2;--nav-on:#D1005B;--nav-on-ink:#fff;
 --bg:#F6F3F4;--surface:#fff;--surface2:#F2ECEF;--head:#F4ECF0;--ink:#231815;--ink2:#5B4F54;--ink3:#8A7C82;--line:#E5DCE0;
 --accent:#D1005B;--accent-h:#A9004A;--accent-ink:#fff;--accent-soft:#FDE4EF;
 --warm:#C8341F;--warm-soft:#FBE4DF;--amber:#A86A0A;--amber-soft:#FBEFD3;--ok:#1E7A46;--ok-soft:#DFF1E6;--danger:#C0392B;
 --shadow:0 1px 2px rgba(35,24,21,.06),0 8px 20px -12px rgba(35,24,21,.25);--overlay:rgba(24,12,18,.5);
 --fh:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;--fb:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;min-height:100%}
#side{width:216px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;align-self:flex-start;padding-left:env(safe-area-inset-left,0px)}
#side{border-right:1px solid var(--line)}.brand{padding:20px 18px 14px}.logo{display:inline-flex;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px;border:1px solid var(--line)}.logo img{display:block;height:46px;width:auto}
.brand b{display:block;font-family:var(--fh);font-weight:900;font-size:17px;letter-spacing:.04em}
.brand small{display:block;font-size:10.5px;color:var(--side-dim);margin-top:2px;letter-spacing:.06em}
#nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nb{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;font-family:var(--fh);font-weight:700;font-size:13.5px;text-align:left}
.nb:hover{background:var(--side-hover)}.nb.on{background:var(--nav-on);color:var(--nav-on-ink)}
.nb.on .c{background:#fff;color:var(--nav-on)}.nb .c{margin-left:auto;font-size:11px;background:var(--warm);color:#fff;border-radius:99px;padding:0 8px;line-height:18px}
.sfoot{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--side-dim);line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--side-dim);margin-right:6px}.dot.ok{background:#5BD38C}.dot.warn{background:#E0A93A}
#main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top h1{font-size:18px}.top .sub{font-size:11.5px;color:var(--ink3)}.grow{flex:1}
.content{padding-block:20px 70px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1280px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{background:var(--accent-h)}
.btn.dng{color:var(--danger);border-color:var(--danger);background:none}.btn.sm{padding:4px 11px;font-size:11.5px}.btn.gh{border-color:transparent;background:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.note{border-radius:10px;padding:10px 14px;background:var(--amber-soft);font-size:12px}.note.info{background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;font:inherit}
.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--ink3);font-weight:700}.kpi .v{font-family:var(--fh);font-size:28px;font-weight:900;line-height:1.1}.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:3px}
.kpi .f{font-size:11px;color:var(--ink2)}.kpi.hot .v{color:var(--warm)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ph h2{font-size:15px}.ph .h{font-size:11px;color:var(--ink3)}
.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}.pipe span{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 10px}
.lg{display:flex;align-items:center;gap:7px;border:0;background:none;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:12px;text-align:left}.lg:hover{background:var(--surface2)}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}.lg b{margin-left:auto;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.mini:first-child{border-top:0}.mini:hover .t{color:var(--accent)}.mini .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .s{font-size:11px;color:var(--ink3)}.mini .d{text-align:right;font-size:11.5px}.late{color:var(--warm);font-weight:700}
.es{font-size:12px;color:var(--ink3);padding:10px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--st);color:#fff;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.w{background:var(--warm-soft);color:var(--warm);border-color:transparent}.tag.a{background:var(--amber-soft);color:var(--amber);border-color:transparent}.tag.o{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.meter{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.meter i{width:54px;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;display:block}.meter i b{display:block;height:100%;background:var(--ok)}.meter.low i b{background:var(--warm)}
.fcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fi{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--ink3);min-width:130px}.fi.g{flex:1 1 220px}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=time],select.inp,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:13px;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}.chip b{margin-left:4px;font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--head);text-align:left;font-size:11.5px;color:var(--ink2);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--surface2)}td.r,th.r{text-align:right}
.cm .nm{font-weight:700;font-size:13px}.cm .ad{font-size:11.5px;color:var(--ink3)}.cm .no{font-size:10.5px;color:var(--ink3)}
.dk{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--ink3)}
.dk.y{background:var(--ok);border-color:var(--ok);color:#fff}.dk.n{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}.dk.x{opacity:.35}
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.empty p{margin:0;max-width:46ch;color:var(--ink2);line-height:1.7}.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#modal{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:4vh max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
#modal .bd{position:absolute;inset:0;background:var(--overlay)}
.mbox{position:relative;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}.mh h3{flex:1;min-width:0;font-size:16px}
.mb{overflow:auto;padding:4px 20px 18px}.mf{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.ib{border:0;background:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--ink2)}.ib:hover{background:var(--surface2)}
.fs{font-size:12px;font-weight:900;color:var(--accent);padding:16px 0 8px;letter-spacing:.06em;font-family:var(--fh)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fd{display:flex;flex-direction:column;gap:4px;min-width:0}.fd.s2{grid-column:span 2}.fd.s3{grid-column:1/-1}
.fd label{font-size:11.5px;font-weight:700;color:var(--ink2)}.fd .req{color:var(--danger)}
.yen{position:relative}.yen input{padding-left:24px}.yen::before{content:"¥";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:12px}
.steps{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}.steps button{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:11.5px;padding:5px 11px;cursor:pointer;color:var(--ink2);font-weight:600}
.steps button.on{background:var(--st);border-color:var(--st);color:#fff;font-weight:700}
.dl{display:flex;flex-direction:column;gap:6px}
.di{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.di.got{background:var(--ok-soft);border-color:transparent}.di label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-weight:600;min-width:0}
.di input{width:17px;height:17px;accent-color:var(--ok)}.di small{color:var(--ink3);font-weight:400}
.fl{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.fl a{flex:1;color:var(--accent);overflow-wrap:anywhere}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink2);font-size:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--danger);font-size:12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:12.5px;z-index:40;max-width:calc(100vw - 32px)}
.imp{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.imp div{display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 4px}
/* 現場管理アプリに合わせた案件画面 */
.cl tbody tr td{background:color-mix(in srgb,var(--st) 9%,var(--surface))}
.cl tbody tr td:first-child{box-shadow:inset 7px 0 0 var(--st);padding-left:18px}
.cl tbody tr:hover td{background:color-mix(in srgb,var(--st) 16%,var(--surface))}
.sl{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:2px 2px 10px;border-bottom:1px solid var(--line)}
.sl b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}.sl .r{margin-left:auto;color:var(--ink3)}
.crumb{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;align-self:flex-start}.crumb:hover{text-decoration:underline}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.dh h1{font-size:20px}.dh .upd{font-size:11px;color:var(--ink3);margin-top:2px}.dact{display:flex;gap:8px;flex-wrap:wrap}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:flex-start;max-width:1180px}.dg>*{min-width:0}
.st2{font-size:12.5px;font-weight:800;padding:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;font-family:var(--fh)}.dg>div>.st2:first-child{padding-top:0}
.kvc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 16px;padding:12px 20px;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.kv dt{font-size:11.5px;color:var(--ink3);font-weight:700}.kv dd{margin:0;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}.kv .mu{color:var(--ink3)}
.kv.hd{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.side{padding:16px 18px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}.side h3{font-size:13px}
.vsteps{display:flex;flex-direction:column;gap:5px}.vsteps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;text-align:left}
.vsteps button i{width:10px;height:10px;border-radius:50%;background:var(--st);flex:none}.vsteps button.on{background:var(--st);border-color:var(--st);color:#fff;font-weight:700}.vsteps button.on i{background:#fff}.vsteps button:disabled{cursor:default;opacity:.7}
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#login .lc{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 28px 26px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#login .lg{align-self:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px}#login .lg img{display:block;height:58px;width:auto}
#login h1{font-size:19px;text-align:center}#login .sub{font-size:12px;color:var(--ink3);text-align:center;margin-top:-8px}
#login input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;font-size:16px;min-width:0}#login input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}#login label.fi{min-width:0}#login .keep{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}#login .btn{justify-content:center;padding:10px 16px;font-size:14px}
.mapl{font-size:12px;font-weight:700;color:var(--accent);margin-left:8px}
@media (max-width:980px){.dg{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
 #app{flex-direction:column}
 #side{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;width:100%;height:auto;flex-direction:row;align-items:center;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
 body::before{background:var(--side)}.brand{padding:10px 8px 10px 0}.brand small,.sfoot{display:none}.brand b{display:none}.logo{margin:0;padding:4px 8px;border-radius:9px}.logo img{height:30px}#side{border-right:0;border-bottom:1px solid var(--line)}
 #nav{flex-direction:row;overflow-x:auto;padding:6px 0;flex:1}.nb{white-space:nowrap;width:auto;padding:8px 10px;font-size:12.5px}.nb .c{display:none}
 .top{position:static;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.top .sub{display:none}
 .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 70px}
 input[type=text],input[type=search],input[type=date],input[type=number],input[type=time],select.inp,textarea{font-size:16px}
 .fi{min-width:0;flex:1 1 100%}.fg,.fg.c3{grid-template-columns:minmax(0,1fr)}.fd.s2,.fd.s3{grid-column:auto}
 .tw{border:0;background:none;overflow:visible}.tw table,.tw thead,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw thead{display:none}
 .tw tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px 14px}
 .tw td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:14px;text-align:right}
 .tw td[data-l]::before{content:attr(data-l);color:var(--ink3);font-size:11.5px;font-weight:600;text-align:left}
 .tw td.cm{display:block;text-align:left;padding-bottom:8px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
 tbody tr:hover td{background:none}#modal{padding-top:2vh}.mbox{max-height:96vh}
 .cl tbody tr td,.cl tbody tr:hover td{background:none}.cl tbody tr td:first-child{box-shadow:none;padding-left:0}
 .cl tr{border-left:8px solid var(--st);background:color-mix(in srgb,var(--st) 9%,var(--surface))}
 .kv{grid-template-columns:104px minmax(0,1fr);padding:11px 14px}.dh h1{font-size:18px}
}
</style>
</head>
<body>

<script>
(function(){
"use strict";
var STATUS=[["依頼受付","#7A6F74"],["調査日調整","#B27511"],["現地調査済","#0E8794"],["報告書提出済","#2D63C8"],["契約締結","#7447C4"],["作業中","#1F8A4C"],["完了報告済","#4A5F8A"],["請求済","#33495F"],["入金済","#176B3D"],["キャンセル","#C0392B"]];
var SK=STATUS.map(function(s){return s[0];});
var CLOSED=["完了報告済","請求済","入金済","キャンセル"],ACTIVE=SK.slice(0,6);
var DOCS=[["apply","スムービング契約申込書","契約時"],["status","契約者状況報告書","契約時"],["survey","現地調査報告書","調査後"],["lease","賃貸借契約書","必須"],["guarantee","賃貸保証委託契約書","必須"],["death","死体検案書・死亡届","孤独死のみ"],["resident","住民票(除票)","必要時"],["photos","調査写真","調査後"]];
var PURPOSE=["無断退去(夜逃げ)判断","孤独死に伴う状況確認"];
var PROPKIND=["集合住宅","戸建"];
var UTIL=["通電中・開栓中","停止中・閉栓中","確認不能"];
var VIEWS=[["home","ホーム"],["cases","案件一覧"],["docs","書類チェック"],["mgr","管理会社別"],["mail","メール取り込み"]];
var state={view:"home",cases:[],mode:"loading",db:null,canWrite:true,assets:null,downloads:null,mcp:null,sample:null,mails:{},gm:{q:"",auto:true,busy:false,consent:false,ok:null,err:"",at:0,scanned:0,sent:0,fail:0,meta:null},demo:false,f:{q:"",status:"active",purpose:"",mgr:""},sort:"receivedDate",detail:null};
var editing=null,toastT;
try{var sv=JSON.parse(localStorage.getItem("ls_f")||"null");if(sv)state.f=Object.assign(state.f,sv);}catch(e){}
try{state.gm.auto=localStorage.getItem("ls_gmauto")!=="0";}catch(e){}
function saveF(){try{localStorage.setItem("ls_f",JSON.stringify(state.f));}catch(e){}}
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function diff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);}
function fd(s){return s?s.replace(/-/g,"/"):"—";}
function fs(s){if(!s)return "—";var p=s.split("-");return (+p[1])+"/"+(+p[2]);}
function yen(n){return n===""||n==null||isNaN(n)?"—":"¥"+Number(n).toLocaleString("ja-JP");}
function stc(k){for(var i=0;i<STATUS.length;i++)if(STATUS[i][0]===k)return STATUS[i][1];return "#7A6F74";}
function amt(c){var a=Number(c.amount);if(c.amount!==""&&c.amount!=null&&!isNaN(a))return a;var q=Number(c.quote);return isNaN(q)?0:q;}
function late(c){return c.dueDate&&CLOSED.indexOf(c.status)<0&&c.dueDate<today();}
function needDocs(c){return DOCS.filter(function(d){return d[0]!=="death"||c.purpose===PURPOSE[1];});}
function have(c,k){return !!(c.docs&&c.docs[k]);}
function missing(c){return needDocs(c).filter(function(d){return d[0]!=="resident"&&!have(c,d[0]);});}
function progress(c){var n=needDocs(c).filter(function(d){return d[0]!=="resident";});var h=n.filter(function(d){return have(c,d[0]);}).length;return {h:h,n:n.length};}
function label(c){return [c.propertyName,c.room?c.room+"号室":""].filter(Boolean).join(" ");}
function sum(a){return a.reduce(function(s,c){return s+amt(c);},0);}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function setSync(c,t){$("#sync").innerHTML='<span class="dot '+c+'"></span><span>'+esc(t)+'</span>';}
function newId(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function nextNo(d){var ym=(d||today()).slice(0,7).replace("-",""),mx=0;state.cases.forEach(function(c){var m=String(c.caseNo||"").match(/^LS-(\d{6})-(\d+)$/);if(m&&m[1]===ym)mx=Math.max(mx,+m[2]);});return "LS-"+ym+"-"+String(mx+1).padStart(3,"0");}

/* ---- データ層 ---- */
var LK="ls_cases_local";
function localLoad(){try{return JSON.parse(localStorage.getItem(LK)||"[]")||[];}catch(e){return [];}}
function localSave(){try{localStorage.setItem(LK,JSON.stringify(state.cases.filter(function(c){return !c._demo;})));}catch(e){}}
function startLocal(){state.mode="local";state.cases=localLoad();setSync("warn","この端末のみに保存");render();}
function boot(){
 if(!window.claude||!window.claude.use){startLocal();return;}
 var done=false,to=setTimeout(function(){if(!done){done=true;startLocal();}},9000);
 Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
  if(done)return;done=true;clearTimeout(to);
  var db=r[0],user=r[1];if(!db){startLocal();return;}
  state.db=db;state.mode="db";
  claude.use("assets").then(function(a){state.assets=a;}).catch(function(){});
  claude.use("downloads").then(function(d){state.downloads=d;}).catch(function(){});
  claude.use("mcp").then(function(m){state.mcp=m;gmArm();}).catch(function(){});
  claude.use("sample").then(function(sm){state.sample=sm;}).catch(function(){});
  db.collection("mails").onSnapshot(function(sn){var o={};sn.docs.forEach(function(d){o[d.id]=Object.assign({},d.data(),{id:d.id});});state.mails=o;drawMail();},function(){});
  db.doc("meta/mail").onSnapshot(function(sn){var d=sn.exists?sn.data():null;state.gm.meta=d;if(d&&d.query&&!state.gm.qEdited){d.query=d.query.replace(/\s*-subject:RE\b/i,"");state.gm.q=d.query;var i=$("#gmq");if(i&&document.activeElement!==i)i.value=d.query;}},function(){});
  if(user&&user.can)user.can("data.write").then(function(v){if(v===false){state.canWrite=false;render();}}).catch(function(){});
  db.collection("cases").onSnapshot(function(snap){
   var real=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
   state.cases=real.length?real:(state.demo?demoRows():[]);if(real.length)state.demo=false;
   setSync("ok","チームで共有中・"+real.length+"件");
   if(!editing)render();else renderNavOnly();
  },function(){setSync("warn","接続が切れました。再読み込みしてください");});
 }).catch(function(){if(!done){done=true;clearTimeout(to);startLocal();}});
}
function errMsg(){return "保存できませんでした。通信状態を確認して、もう一度保存してください。";}
function saveCase(c){
 c.updatedAt=new Date().toISOString();
 var body=Object.assign({},c);delete body.id;delete body._demo;
 if(state.mode==="db")return state.db.collection("cases").doc(c.id).set(body);
 var i=state.cases.findIndex(function(x){return x.id===c.id;});if(i>=0)state.cases[i]=c;else state.cases.push(c);
 localSave();render();return Promise.resolve();
}
function delCase(id){
 if(state.mode==="db")return state.db.collection("cases").doc(id).delete();
 state.cases=state.cases.filter(function(x){return x.id!==id;});localSave();render();return Promise.resolve();
}

function renderNavOnly(){
 var act=state.cases.filter(function(c){return ACTIVE.indexOf(c.status)>=0;}).length;
 var mis=state.cases.filter(function(c){return ACTIVE.indexOf(c.status)>=0&&missing(c).length;}).length;
 $("#nav").innerHTML=VIEWS.map(function(v){var n=v[0]==="cases"?act:v[0]==="docs"?mis:v[0]==="mail"?state.cases.filter(function(c){return c.needsReview;}).length:0;return '<button class="nb'+(state.view===v[0]?" on":"")+'" data-nav="'+v[0]+'" type="button">'+v[1]+(n?'<span class="c">'+n+'</span>':'')+'</button>';}).join("");
}
function render(){
 renderNavOnly();
 var c=$("#content"),banner="";
 $("#b-new").disabled=!state.canWrite;$("#b-imp").disabled=!state.canWrite;$("#b-csv").hidden=!(state.view==="cases"&&!state.detail);
 if(state.mode==="local")banner+='<div class="note"><b>この端末のブラウザにだけ保存しています。</b> チームで共有するには、claude.ai にログインした状態でこのページを開いてください。</div>';
 if(!state.canWrite)banner='<div class="note info">閲覧のみの権限です。登録・編集には「編集できる」権限が必要です。</div>';
 if(state.demo)banner+='<div class="note info"><b>サンプルを表示しています。</b> 見本の案件は保存されません。最初の案件を登録すると実データに切り替わります。 <button class="btn sm" data-act="hide-demo" type="button">サンプルを閉じる</button></div>';
 if(state.mode==="loading"){c.innerHTML='<div class="card empty"><p>案件データを読み込んでいます…</p></div>';return;}

 for(var k=0;k<items.length;k++){var it=items[k],nm=it.name.replace(/[\\\/:*?"<>|]/g,"_");
  if(seen[nm]){nm=(k+1)+"_"+nm;}seen[nm]=1;

}

function normSubj(x){return String(x||"").replace(/^(\s*(re|fw|fwd|返信|転送)\s*[:：]\s*)+/i,"").replace(/\s+/g," ").trim();}
function stripQuote(b){b=String(b||"").replace(/\r/g,"");var m=/\n\s*(From:|差出人:|送信者:|-{3,}\s*(Original|元の)|_{8,}|On .{5,100} wrote:|.{0,40}(さんは|様は|氏は).{0,40}書きました)/i.exec(b);if(m)b=b.slice(0,m.index);return b.split("\n").filter(function(l){return !/^\s*[>＞]/.test(l);}).join("\n").replace(/\n{3,}/g,"\n\n").trim().slice(0,1500);}
function gmFindCases(tid,subj){
 var ns=normSubj(subj),subs={};Object.keys(state.mails).forEach(function(k){subs[k]=normSubj(state.mails[k].subject);});
 return state.cases.filter(function(c){if(c._demo||c.source!=="gmail")return false;return (tid&&(c.threadId===tid||c.mailId===tid))||(ns&&c.mailId&&subs[c.mailId]&&subs[c.mailId]===ns);});
}

 var base={id:m.id,subject:m.subject||"",from:m.sender||"",date:m.date||"",url:m.url||"",threadId:m.threadId||"",at:new Date().toISOString(),state:"processing",caseIds:[],reason:"",kind:"reply"};

 if(/請求書|ご請求|お支払|振込/.test(base.subject)&&!/孤独死|無断退去/.test(base.subject)){base.state="skip";base.reason="請求書・支払いの連絡";await logRef.set(base);return base;}
 await logRef.set(base);
 try{

   o.thread.sort(function(a,b){return String(a.date)<String(b.date)?-1:1;});

async function gmRun(manual,deep){
 var g=state.gm;if(g.busy||!state.mcp||state.mode!=="db"||!state.canWrite)return;
 g.busy=true;g.err="";g.stop=false;g.deep=!!deep;g.prog=deep?"メールを探しています…":"";drawMail();
 var reg=0,fail=0,lnk=0,list=[],q=g.q||GMQ0,tok="",pages=0,seen={};
 if(deep){q=q.replace(/\s*newer_than:\S+/ig,"");if(deep.days)q+=" newer_than:"+deep.days+"d";}
 try{
  do{
   var sp={query:q,pageSize:deep?50:30};if(tok)sp.pageToken=tok;
   var p=await gmCall("search_threads",sp);
   var ths=p.threads||[];
   for(var ti=0;ti<ths.length;ti++){var t=ths[ti],ms=t.messages||[];
    if((t.messageCount||0)>ms.length){try{var tt=await gmCall("get_thread",{threadId:t.id,messageFormat:"MINIMAL"});if(tt.messages&&tt.messages.length>=ms.length)ms=tt.messages;}catch(e3){if(authErr(e3))throw e3;}}

     list.push({id:m.id,subject:m.subject||"",sender:m.sender||"",date:m.date||"",url:m.viewUrl||"",threadId:m.threadId||t.id||"",reply:isReply(m.subject)||(ms.length>1&&m.id!==t.id)});});}
   tok=deep?(p.nextPageToken||""):"";pages++;
   if(deep){g.prog="メールを探しています… "+list.length+"通";drawMail();}
  }while(tok&&pages<60&&!g.stop);
  list.sort(function(a,b){if(a.reply!==b.reply)return a.reply?1:-1;return String(a.date)<String(b.date)?-1:1;});
  g.consent=true;
  for(var i=0;i<list.length&&i<(deep?1e6:manual?40:15)&&!g.stop;i++){
   if(deep){g.prog="取り込み中 "+(i+1)+" / "+list.length+"通(登録 "+reg+"・紐づけ "+lnk+")";drawMail();}
   try{var lg=list[i].reply?await gmReply(list[i]):await gmIngest(list[i]);if(lg.state==="registered")reg+=lg.caseIds.length;else if(lg.state==="linked")lnk+=lg.caseIds.length;}
   catch(x){if(authErr(x))throw x;fail++;}
  }

 }catch(x){g.ok=false;g.err=gmErr(x);}
 g.at=Date.now();g.scanned=list.length;g.sent=reg;g.linked=lnk;g.fail=fail;g.busy=false;g.prog="";
 if(reg||lnk||manual){state.db.doc("meta/mail").set({query:g.q||GMQ0,lastRunAt:new Date().toISOString(),lastAdded:reg}).catch(function(){});}
 drawMail();
 if(reg||lnk)toast((reg?"メールから "+reg+" 件を登録しました。":"")+(lnk?"返信メール "+lnk+" 件を案件に紐づけました。":""));
 else if(manual&&g.ok)toast(list.length?"新しい案件の依頼はありませんでした":"新着メールはありません");
 if(deep&&g.ok)toast((g.stop?"中断しました。":"過去のメールの取り込みが終わりました。")+"確認 "+list.length+"通・登録 "+reg+"件・返信の紐づけ "+lnk+"件"+(fail?"・失敗 "+fail+"通":""));

/* ---- フォルダ取り込み ---- */
function parseFolder(name){
 var m=/^(\d{8})_(.+)$/.exec(name);if(!m)return null;
 var d=m[1].slice(0,4)+"-"+m[1].slice(4,6)+"-"+m[1].slice(6,8),rest=m[2],contractor="";
 var p=/[（(]([^）)]*)[）)]\s*$/.exec(rest);if(p){contractor=p[1].replace(/宅$/,"").trim();rest=rest.slice(0,p.index);}
 var room="",r=/\s*(\d{1,4}|[A-Za-z]-?\d+)\s*号室\s*$/.exec(rest)||null;
 if(r){room=r[1];rest=rest.slice(0,r.index);}
 else{var r2=/(.*?[^\d])(\d{3,4})$/.exec(rest);if(r2&&r2[1].length>1){room=r2[2];rest=r2[1];}}
 return {date:d,property:rest.trim(),room:room,contractor:contractor};
}

 $("#modal").hidden=false;
 $("#dirinp").addEventListener("change",function(e){

  files.forEach(function(f){var parts=(f.webkitRelativePath||"").split("/");if(parts.length<3)return;var k=parts[1];(dirs[k]=dirs[k]||[]).push(parts[parts.length-1]);});

  $("#impgo").disabled=!ok.length;
 });

var LOGIN_HASH="03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4",AK="ls_auth";
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");});}
function authed(){try{return localStorage.getItem(AK)===LOGIN_HASH||sessionStorage.getItem(AK)===LOGIN_HASH;}catch(e){return false;}}
function startApp(){$("#login").hidden=true;if(!window.claude){$("#lo").innerHTML='<a href="#" id="logout" style="color:inherit">ログアウト</a>';}render();boot();}
function showLogin(){
 var l=$("#login");l.hidden=false;$("#lgimg").src=$(".logo img").src;
 $("#lform").addEventListener("submit",function(e){
  e.preventDefault();var err=$("#lerr");err.textContent="";
  if(!window.crypto||!crypto.subtle){err.textContent="このブラウザではログインを確認できません。https で開いてください。";return;}
  sha($("#lpw").value.trim()).then(function(x){
   if(x!==LOGIN_HASH){err.textContent="パスコードが違います。";$("#lpw").select();return;}
   try{(($("#lkeep").checked)?localStorage:sessionStorage).setItem(AK,x);}catch(e2){}
   $("#lpw").value="";startApp();});
 });
 setTimeout(function(){$("#lpw").focus();},50);
}
document.addEventListener("click",function(e){var t=e.target.closest("#logout");if(!t)return;e.preventDefault();try{localStorage.removeItem(AK);sessionStorage.removeItem(AK);}catch(x){}location.reload();});
if(!window.claude&&!authed()){showLogin();}else{startApp();}
})();
</script>
